<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ПЕНОПЛЭКС Технарь</title>
    <link rel="icon" href="data:," />
    <noscript><meta http-equiv="refresh" content="0;url=./blagoustroystvo/" /></noscript>
    <script>
      const query = new URLSearchParams(location.search);
      const view = new URLSearchParams(location.hash.slice(1));
      const stilobatLink =
        view.get("system") === "stilobat-v2" ||
        ["about", "documents"].includes(query.get("tab")) ||
        ["#system-gallery", "#explorer", "#about", "#documents"].includes(location.hash);
      const section = stilobatLink ? "./blagoustroystvo/stilobat/" : "./blagoustroystvo/";
      location.replace(section + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="./blagoustroystvo/">Открыть раздел «Благоустройство»</a>
  </body>
</html>
